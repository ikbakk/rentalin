  <circle cx="128" cy="196" r="4" fill="none" stroke="oklch(0.75 0.18 85)" stroke-opacity="0.6" stroke-width="1.5"/>
  <circle cx="144" cy="196" r="4" fill="none" stroke="oklch(0.75 0.18 85)" stroke-opacity="0.35" stroke-width="1.5"/>

