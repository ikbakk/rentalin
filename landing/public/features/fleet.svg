  <rect width="400" height="300" fill="oklch(0.15 0.008 280)"/>
  <rect x="1.5" y="1.5" width="397" height="297" rx="13" stroke="oklch(0.24 0.008 280)" stroke-width="1.5"/>

  <!-- ambient rings -->
  <circle cx="200" cy="142" r="86" stroke="oklch(0.75 0.18 85)" stroke-opacity="0.07" stroke-width="1.5"/>
  <circle cx="200" cy="142" r="66" stroke="oklch(0.75 0.18 85)" stroke-opacity="0.05" stroke-width="1.5"/>

  <!-- lucide Car icon (24x24 scaled 3.2x) -->
