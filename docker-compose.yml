# docker-compose.yml — Single-VPS deployment
# Run: docker compose up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rentalin-api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Default=${CONNECTIONSTRINGS__DEFAULT:-Data Source=/data/rentalin.db}
      - Jwt__Secret=${JWT__SECRET}
      - Cors__FrontendOrigin=${CORS__FRONTENDORIGIN:-http://localhost:3000}
    volumes:
      - rentalin_data:/data
      - rentalin_uploads:/app/uploads
    networks:
      - rentalin_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rentalin-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://backend:5000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - rentalin_net

  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: rentalin-landing
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    networks:
      - rentalin_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: rentalin-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
      - landing
    networks:
      - rentalin_net

volumes:
  rentalin_data:
  rentalin_uploads:

networks:
  rentalin_net:
    driver: bridge
