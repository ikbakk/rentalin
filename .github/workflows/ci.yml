name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  convex:
    name: Convex typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ops

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install shared root dependencies
        run: npm ci --no-audit --no-fund
        working-directory: .
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:release-env
      - run: npm run build
        env:
          NEXT_PUBLIC_CONVEX_URL: https://ci-placeholder.convex.cloud
          CONVEX_SITE_URL: https://ci-placeholder.convex.site
          NEXT_PUBLIC_FRONTEND_URL: https://rentalin-ci.example.com
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "1x00000000000000000000AA"

  landing:
    name: Landing site build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:release-env
      - run: npm run build
        env:
          PUBLIC_APP_URL: "https://app.example.test"
          PUBLIC_WHATSAPP_NUMBER: "6280000000000"
